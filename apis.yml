description: 'Super Sports Media Group is an IDG Capital-backed Chinese sports-media company best known
  for holding the English Premier League broadcast rights in mainland China and operating consumer sports
  streaming and content services under the ssports.com brand. Its platform was subsequently absorbed into
  iQiyi Sports (爱奇艺体育), and ssports.com now redirects there. This is a business-to-consumer sports
  streaming and media-rights operation with no public developer program: no API documentation, developer
  portal, SDKs, OpenAPI, or open platform surface could be found during enrichment. Profile retained as a
  network company record.'
